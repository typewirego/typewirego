name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: "Version to release, without the v (e.g. 0.1.0)"
      dry-run:
        type: boolean
        default: true
        description: "Dry run (validate and run CI only; create no tag)"

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid version: $VERSION (expected X.Y.Z or X.Y.Z-pre)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Check the tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. Tags are permanent; release a new version."
            exit 1
          fi

  ci:
    name: CI
    needs: [validate]
    uses: ./.github/workflows/ci.yml

  changelog:
    name: Changelog
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check CHANGELOG.md has a heading for the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! grep -qxF "## $VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' heading"
            exit 1
          fi

      - name: Dry run summary
        if: inputs.dry-run
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "::notice::Dry run passed for v$VERSION; no tag was created."
          echo "::notice::To release, run again with dry-run off."

  release:
    name: Tag and release
    needs: [changelog]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create and push the tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$VERSION"

      - name: Create the GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --generate-notes --verify-tag

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Announce the version to the Go module proxy
        env:
          VERSION: ${{ inputs.version }}
        run: GOPROXY=https://proxy.golang.org go list -m "github.com/typewirego/typewirego@v$VERSION"
